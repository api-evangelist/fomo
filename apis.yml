aid: fomo
name: fomo
description: >-
  fomo (FOMO Labs Inc.) is a social-first cryptocurrency trading platform available as a
  mobile app and web platform. It lets mainstream retail investors trade memecoins, altcoins,
  and stablecoins across multiple blockchains without managing wallets, paying gas fees, or
  transferring assets manually, wrapping on-chain trading in a social layer where users
  discover tokens, follow top traders, view real-time buy alerts, copy trades, and compete on
  leaderboards. Onboarding is quick with Apple Pay funding, and trading is multichain and
  gasless. Founded in 2025 by former Deutsche Bank and dYdX team members (CEO Paul Erlanger,
  Se Yong Park, Prashan Dharmasena), the New York company reports 500,000+ active traders,
  625,000+ total users, and $4B+ in trading volume. In June 2026 it raised a $75M Series B led
  by Index Ventures with Union Square Ventures and Benchmark at a $550M valuation. fomo is a
  consumer-facing product and does not publish a public developer API, SDKs, or API
  documentation; this API Evangelist profile captures its company identity and domain-security
  posture.
